{% extends 'tienda/base.html' %}

{% block contenido %}
<h2>Formulario - Agregar Cliente</h2>

<form action="{% url 'clientes' %}" method="POST">
    {% csrf_token %}
    {{ formulario.as_p }}
    <button type="submit">Enviar</button>
</form>

{% if mensaje %}
<p>{{ mensaje }}</p>
{% endif %}
{% endblock %}
